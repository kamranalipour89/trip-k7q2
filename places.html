<style>
@page{size:11in 8.5in;margin:0}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:-apple-system,"Helvetica Neue",Helvetica,Arial,sans-serif;background:#e9edf3;color:#1f2933}
.bar{text-align:center;padding:8px;background:#1f3a5f}
.bar a{color:#fff;font-size:13px;text-decoration:none;margin:0 10px;opacity:.9}
.sheet{width:11in;height:8.5in;margin:14px auto;background:#fff;display:flex;flex-direction:column;box-shadow:0 2px 14px rgba(0,0,0,.2);break-after:page;page-break-after:always;overflow:hidden}
.top{background:#1f3a5f;color:#fff;padding:.15in .3in .12in;display:flex;justify-content:space-between;align-items:baseline;gap:.3in}
.top h1{margin:0;font-size:23pt;letter-spacing:.2px}
.top .sub{font-size:9.3pt;opacity:.88;text-align:right}
.body{flex:1;display:grid;grid-template-columns:6.3in 1fr;min-height:0}
.map{position:relative;background:#dfe6ee;border-right:1px solid #d5dce6}
.map>div{position:absolute;inset:0}
.list{padding:.13in .2in .1in;overflow:hidden;font-size:10pt}
.seg{margin:0 0 .09in}
.seg h2{margin:0 0 3px;font-size:9.3pt;color:#fff;background:var(--c);display:inline-block;padding:2px 10px;border-radius:999px;font-weight:700}
.row{display:flex;gap:7px;align-items:flex-start;padding:1.5px 0;line-height:1.25}
.n{flex:none;width:1.75em;height:1.75em;border-radius:50%;background:var(--c);color:#fff;font-weight:700;font-size:.82em;display:flex;align-items:center;justify-content:center;margin-top:.05em}
.t{flex:1;min-width:0}
.n.off{background:#fff;color:var(--c);border:1.5px solid var(--c)}
.offtx{color:#6b7785;font-size:.85em}
.tm{flex:none;color:#6b7785;font-size:.85em;white-space:nowrap;margin-left:4px}
.food{display:flex;gap:6px;align-items:flex-start;margin-top:3px;color:#52606d;font-size:.86em;line-height:1.3}
.food img{width:1.4em;height:1.4em;flex:none}
.pin{width:24px;height:24px;border-radius:50%;background:var(--c);color:#fff;border:2px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.45);font:700 11px -apple-system,Arial,sans-serif;display:flex;align-items:center;justify-content:center;transform:translate(-50%,-50%)}
.pin.h{background:#2b2f36}
.pin.wide{width:auto;min-width:24px;padding:0 6px;border-radius:12px}
.foot{padding:.05in .3in;font-size:7.5pt;color:#8996a6;display:flex;justify-content:space-between}
@media screen and (max-width:900px){
  .sheet{width:100%;height:auto;margin:10px 0}
  .top{display:block}.top .sub{text-align:left;margin-top:3px}
  .body{display:block}
  .map{height:62vh;border-right:0}
  .list{overflow:visible;font-size:14px!important}
}
@media print{
  body{background:#fff}.bar{display:none}
  .sheet{margin:0;box-shadow:none;width:11in;height:8.5in}
}
body.pdf .bar{display:none}body.pdf .sheet{margin:0;box-shadow:none;width:11in;height:8.5in}

const q = new URLSearchParams(location.search);
if (q.get('pdf')) document.body.classList.add('pdf');
const only = q.get('only');
const root = document.getElementById('root');
PAGES.filter(p => !only || p.id === only).forEach(p => {
  const segs = p.segs.map(s => `
    <div class="seg" style="--c:${s.color}">
      <h2>${esc(s.label)}</h2>
      ${s.items.map(i => `<div class="row"><span class="n${i.n ? '' : ' off'}">${i.n || '&#8599;'}</span><span class="t">${esc(i.title)}${i.off ? ` <span class="offtx">(${esc(i.off)})</span>` : ''}</span>${i.time ? `<span class="tm">${esc(i.time)}</span>` : ''}</div>`).join('')}

    </div>`).join('');
  const sheet = document.createElement('section');
  sheet.className = 'sheet'; sheet.id = 's-' + p.id;
  sheet.innerHTML = `
    <div class="top"><h1>${esc(p.name)}</h1><div class="sub">${esc(p.hotel)}</div></div>
    <div class="body"><div class="map"><div id="m-${p.id}"></div></div><div class="list">${segs}</div></div>
    <div class="foot"><span>Italy 2026 &middot; places to visit</span><span>Map &copy; OpenStreetMap contributors</span></div>`;
  root.appendChild(sheet);
});
// keep each list on its page: shrink the text until it fits
function fitLists(){
  document.querySelectorAll('.sheet .list').forEach(l => {
    if (window.innerWidth <= 900 && !document.body.classList.contains('pdf')) return;
    let fs = 10.5; l.style.fontSize = fs + 'pt';
    while (l.scrollHeight > l.clientHeight + 1 && fs > 6) { fs -= .25; l.style.fontSize = fs + 'pt'; }
  });
}
fitLists();
if (typeof L !== 'undefined') {
  PAGES.filter(p => !only || p.id === only).forEach(p => {
    const m = L.map('m-' + p.id, {zoomControl: false, scrollWheelZoom: false, attributionControl: false, fadeAnimation: false, zoomAnimation: false, markerZoomAnimation: false});
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom: 19}).addTo(m);
    const pts = [];
    p.hotels.forEach(h => { pts.push(h); L.marker(h, {icon: L.divIcon({className:'', iconSize:[0,0], html:'<div class="pin h">H</div>'}), interactive:false}).addTo(m); });
    const spots = {};
    p.segs.forEach(s => s.items.forEach(i => {
      if (!i.ll) return;
      pts.push(i.ll);
      const k = i.ll.join(',');
      (spots[k] = spots[k] || {ll: i.ll, color: s.color, list: []}).list.push({n: i.n, title: i.title, label: s.label});
    }));
    Object.values(spots).forEach(sp => {
      const nums = sp.list.map(x => x.n).join('&amp;');
      L.marker(sp.ll, {icon: L.divIcon({className:'', iconSize:[0,0], html:`<div class="pin ${sp.list.length > 1 ? 'wide' : ''}" style="--c:${sp.color}">${nums}</div>`})}).addTo(m)
        .bindPopup(sp.list.map(x => '<b>' + esc(x.title) + '</b><br>' + esc(x.label)).join('<hr>'));
    });
    const fit = () => { m.invalidateSize(); if (pts.length > 1) m.fitBounds(pts, {padding:[34,34], maxZoom:16, animate:false}); else if (pts.length) m.setView(pts[0], 15); };
    fit(); setTimeout(fit, 150);
    window.addEventListener('resize', fit);
    window.addEventListener('beforeprint', () => setTimeout(fit, 50));
    (window.__maps = window.__maps || {})[p.id] = m;
  });
}
window.addEventListener('resize', fitLists);
window.addEventListener('beforeprint', fitLists);
</script></body></html>
